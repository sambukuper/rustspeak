[package]
name = "rustspeak"
version = "0.2.0"
edition = "2021"
description = "RustSpeak — a Rust-native voice client inspired by TeamSpeak 3 (3.5.6). Channel tree, chat, PTT, and plugin API v25 surface."
license = "MIT"
authors = ["RustSpeak Contributors"]
readme = "README.md"
keywords = ["teamspeak", "voice", "voip", "rust", "client"]
categories = ["network-programming", "multimedia"]
rust-version = "1.99"

[dependencies]
# wgpu crashes on GPU init (segfault, window never opens); glow opens fine.
eframe = { version = "0.37", default-features = false, features = ["accesskit", "clipboard", "default_fonts", "glow", "system_fonts"] }
egui = "0.37"

[build-dependencies]

[profile.release]
lto = true
opt-level = 3
debug = false
