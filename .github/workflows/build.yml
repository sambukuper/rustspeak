name: Build RustSpeak

permissions:
  contents: write

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: Windows x64
            target: x86_64-pc-windows-msvc
            exe: rustspeak.exe
          - os: ubuntu-latest
            name: Linux x64
            target: x86_64-unknown-linux-gnu
            exe: rustspeak
          - os: macos-latest
            name: macOS Apple Silicon
            target: aarch64-apple-darwin
            exe: rustspeak
          - os: macos-latest
            name: macOS Intel
            target: x86_64-apple-darwin
            exe: rustspeak

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Test
        run: cargo test --release --target ${{ matrix.target }}

      - name: Build
        run: cargo build --release --target ${{ matrix.target }}

      - name: Smoke test version
        shell: bash
        run: |
          BIN="target/${{ matrix.target }}/release/${{ matrix.exe }}"
          "$BIN" --version
          "$BIN" --help | head -n 5

      - name: Smoke test connect flow (no network)
        shell: bash
        run: |
          BIN="target/${{ matrix.target }}/release/${{ matrix.exe }}"
          "$BIN" connect play.rustspeak.gg Alice | head -n 8

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: rustspeak-${{ matrix.name }}
          path: target/${{ matrix.target }}/release/${{ matrix.exe }}
          if-no-files-found: error

      - name: Release asset (tags)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: target/${{ matrix.target }}/release/${{ matrix.exe }}
